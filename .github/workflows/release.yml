name: Build Multi-Platform Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            cmd: npx electron-builder --linux deb AppImage --publish never
          - os: windows-latest
            platform: windows
            cmd: npx electron-builder --win nsis portable zip --publish never
          - os: macos-latest
            platform: macos
            cmd: npx electron-builder --mac dmg zip --publish never

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Windows ADB platform-tools are bundled
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $dest = "resources/bin/win32"
          if (-not (Test-Path "$dest/adb.exe")) {
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools-win.zip"
            Expand-Archive -Path "platform-tools-win.zip" -DestinationPath "pt-temp" -Force
            Copy-Item "pt-temp/platform-tools/adb.exe" $dest -Force
            Copy-Item "pt-temp/platform-tools/AdbWinApi.dll" $dest -Force
            Copy-Item "pt-temp/platform-tools/AdbWinUsbApi.dll" $dest -Force
            Remove-Item "platform-tools-win.zip" -Force
            Remove-Item "pt-temp" -Recurse -Force
          }

      - name: Build frontend & backend
        run: npm run build

      - name: Package Electron application (${{ matrix.platform }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.cmd }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidBridge-${{ matrix.platform }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            !release/*blockmap*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            !release/*blockmap*
          generate_release_notes: true

