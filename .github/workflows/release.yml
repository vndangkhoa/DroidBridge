name: Build Multi-Platform Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            cmd: npx electron-builder --linux deb AppImage --publish never
          - os: windows-latest
            platform: windows
            cmd: npx electron-builder --win nsis portable --publish never
          - os: macos-latest
            platform: macos
            cmd: npx electron-builder --mac dmg zip --publish never

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend & backend
        run: npm run build

      - name: Package Electron application (${{ matrix.platform }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ${{ matrix.cmd }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DroidBridge-${{ matrix.platform }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
            !release/*blockmap*
